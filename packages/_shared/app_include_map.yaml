# Maps matter_app project dirs to matter_sdk example include dirs.
# Used by packages/_shared/app_include_sync.py to copy *.h into
# <app_dir>/include/ for package builds (matter_app does not ship matter_sdk).
#
# Keys: path relative to matter_extension repo root
# Values: path relative to matter_sdk root
#
# After migration, each mapped app's .slcp should use:
#   include:
#     - path: include
#       file_list: [AppConfig.h, ...]
# (no directory: — path is already in-project)

