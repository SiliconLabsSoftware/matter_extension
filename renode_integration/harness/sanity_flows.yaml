test_tc_binfo_2_01:
  steps:
  - type: readonly_pair
    read: chip-tool basicinformation read data-model-revision 101 0
    write: chip-tool basicinformation write-by-id 0 100 101 0
  - type: readonly_pair
    read: chip-tool basicinformation read vendor-name 101 0
    write: chip-tool basicinformation write-by-id 1 '"abcd"' 101 0
  - type: readonly_pair
    read: chip-tool basicinformation read vendor-id 101 0
    write: chip-tool basicinformation write-by-id 2 100 101 0
  - type: readonly_pair
    read: chip-tool basicinformation read product-name 101 0
    write: chip-tool basicinformation write-by-id 3 '"abcd"' 101 0
  - type: readonly_pair
    read: chip-tool basicinformation read product-id 101 0
    write: chip-tool basicinformation write-by-id 4 100 101 0
  - type: readonly_pair
    read: chip-tool basicinformation read node-label 101 0
    write: chip-tool basicinformation write node-label '"abcd"' 101 0
    writable: true
    expect_after_write: abcd
  - type: readonly_pair
    read: chip-tool basicinformation read location 101 0
    write: chip-tool basicinformation write location CA 101 0
    writable: true
    expect_after_write: CA
  - type: readonly_pair
    read: chip-tool basicinformation read hardware-version 101 0
    write: chip-tool basicinformation write-by-id 7 100 101 0
  - type: readonly_pair
    read: chip-tool basicinformation read hardware-version-string 101 0
    write: chip-tool basicinformation write-by-id 8 '"abcd"' 101 0
  - type: readonly_pair
    read: chip-tool basicinformation read software-version 101 0
    write: chip-tool basicinformation write-by-id 9 1234 101 0
  - type: readonly_pair
    read: chip-tool basicinformation read software-version-string 101 0
    write: chip-tool basicinformation write-by-id 10 '"abcd"' 101 0
  - type: readonly_pair
    read: chip-tool basicinformation read manufacturing-date 101 0
    write: chip-tool basicinformation write-by-id 11 '"abcd"' 101 0
  - type: readonly_pair
    read: chip-tool basicinformation read part-number 101 0
    write: chip-tool basicinformation write-by-id 12 '"abcd"' 101 0
  - type: readonly_pair
    read: chip-tool basicinformation read product-url 101 0
    write: chip-tool basicinformation write-by-id 13 '"abcd"' 101 0
  - type: readonly_pair
    read: chip-tool basicinformation read product-label 101 0
    write: chip-tool basicinformation write-by-id 14 '"abcd"' 101 0
  - type: readonly_pair
    read: chip-tool basicinformation read serial-number 101 0
    write: chip-tool basicinformation write-by-id 15 '"abcd"' 101 0
  - command: chip-tool basicinformation read local-config-disabled 101 0
    expect: 'LocalConfigDisabled:'
  - command: chip-tool basicinformation write local-config-disabled 1 101 0
    expect: status = 0x00 \(SUCCESS\)
  - command: chip-tool basicinformation read local-config-disabled 101 0
    expect: LocalConfigDisabled:\s*1
  - command: chip-tool basicinformation write local-config-disabled 0 101 0
    expect: status = 0x00 \(SUCCESS\)
  - type: readonly_pair
    read: chip-tool basicinformation read reachable 101 0
    write: chip-tool basicinformation write-by-id 17 1 101 0
    skip_if_unsupported: true
  - type: readonly_pair
    read: chip-tool basicinformation read unique-id 101 0
    write: chip-tool basicinformation write-by-id 18 '"abcd"' 101 0
  - type: readonly_pair
    read: chip-tool basicinformation read capability-minima 101 0
    write: chip-tool basicinformation write-by-id 19 '"abcd"' 101 0
  - type: readonly_pair
    read: chip-tool basicinformation read product-appearance 101 0
    write: chip-tool basicinformation write-by-id 20 1 101 0
    skip_if_unsupported: true
  - type: readonly_pair
    read: chip-tool basicinformation read max-paths-per-invoke 101 0
    write: chip-tool basicinformation write-by-id 22 '"abcd"' 101 0
  - type: readonly_pair
    read: chip-tool basicinformation read specification-version 101 0
    write: chip-tool basicinformation write-by-id 21 1234 101 0
test_tc_cnet_4_22:
  steps:
  - command: chip-tool networkcommissioning scan-networks 101 0 --Breadcrumb 1
    expect: networkingStatus:\s*0
  - command: chip-tool generalcommissioning read breadcrumb 101 0
    expect: Breadcrumb:\s*1
  - command: chip-tool networkcommissioning scan-networks 101 0 --Breadcrumb 2
    expect: networkingStatus:\s*0
  - command: chip-tool generalcommissioning read breadcrumb 101 0
    expect: Breadcrumb:\s*2
  - command: chip-tool networkcommissioning scan-networks 101 0 --Breadcrumb 3
    expect: networkingStatus:\s*0
  - command: chip-tool generalcommissioning read breadcrumb 101 0
    expect: Breadcrumb:\s*3
test_tc_cnet_4_06:
  steps:
  - command: chip-tool networkcommissioning read networks 101 0
    extract:
      thread_net_id: NetworkID:\s*hex:([0-9A-Fa-f]+)
  - command: chip-tool descriptor read server-list 101 0
    expect: \b49\b
  - command: chip-tool networkcommissioning read feature-map 101 0
    expect: FeatureMap:\s*2
  - command: chip-tool networkcommissioning add-or-update-thread-network hex:{thread_net_id} 101 0 --Breadcrumb 1
    expect_status: FAILSAFE_REQUIRED
  - command: chip-tool networkcommissioning remove-network hex:{thread_net_id} 101 0 --Breadcrumb 1
    expect_status: FAILSAFE_REQUIRED
  - command: chip-tool networkcommissioning connect-network hex:{thread_net_id} 101 0 --Breadcrumb 1
    expect_status: FAILSAFE_REQUIRED
