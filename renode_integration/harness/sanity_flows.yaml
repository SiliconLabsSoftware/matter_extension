# Matter CI sanity steps ported from Jenkins UTF (node 101, brd4187c lighting).
test_tc_commission:
  steps:
  - command: chip-tool descriptor read device-type-list 101 0xFFFF
    expect: status = 0x00 \(SUCCESS\)
  - command: chip-tool descriptor read server-list 101 0
    expect: status = 0x00 \(SUCCESS\)
  - command: chip-tool descriptor read server-list 101 1
    expect: status = 0x00 \(SUCCESS\)
  - command: chip-tool accesscontrol read feature-map 101 0
    expect: status = 0x00 \(SUCCESS\)
test_tc_i_1_01:
  steps:
  - command: chip-tool identify read cluster-revision 101 1
    expect: status = 0x00 \(SUCCESS\)
  - command: chip-tool identify read feature-map 101 1
    expect: status = 0x00 \(SUCCESS\)
  - command: chip-tool identify read attribute-list 101 1
    expect: \[1\]:\s*0
  - command: chip-tool identify read accepted-command-list 101 1
    expect: \[1\]:\s*0
  - command: chip-tool identify read generated-command-list 101 1
    expect: 0 entries
test_tc_i_2_01:
  steps:
  - command: chip-tool identify read identify-time 101 1
    expect: 'IdentifyTime:'
  - command: chip-tool identify write identify-time 100 101 1
    expect: status = 0x00 \(SUCCESS\)
  - command: chip-tool identify read identify-time 101 1
    expect: IdentifyTime:\s*100
  - type: readonly_pair
    read: chip-tool identify read identify-type 101 1
    write: chip-tool identify write-by-id 1 0 101 1
test_tc_i_2_02:
  steps:
  - command: chip-tool identify read identify-type 101 1
    expect: 'IdentifyType:'
  - command: chip-tool identify identify 60 101 1
    expect: status = 0x00 \(SUCCESS\)
  - command: chip-tool identify read identify-time 101 1
    expect: IdentifyTime:\s*([4-5][0-9]|60)
  - command: sleep 10
  - command: chip-tool identify read identify-time 101 1
    expect: IdentifyTime:\s*([3-4][0-9]|50)
  - command: chip-tool identify identify 0 101 1
    expect: status = 0x00 \(SUCCESS\)
  - command: chip-tool identify read identify-time 101 1
    expect: IdentifyTime:\s*0
  - command: chip-tool identify write identify-time 15 101 1
    expect: status = 0x00 \(SUCCESS\)
  - command: sleep 15
  - command: chip-tool identify read identify-time 101 1
    expect: IdentifyTime:\s*[0-5]\b
