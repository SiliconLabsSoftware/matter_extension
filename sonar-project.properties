# SonarQube project: https://sonarqube.silabs.net/dashboard?id=unify_matter_pc
# First-party C and C++ only. All of third_party is out of scope.
# Coverage is optional: Jenkins passes -Dsonar.coverageReportPaths when a valid
# report exists. Do not set it here; leftover/invalid XML fails the scan.

sonar.projectKey=matter_extension
sonar.host.url=https://sonarqube.silabs.net

sonar.sourceEncoding=UTF-8

sonar.sources=slc,silabs_utils

# C and C++ only
sonar.inclusions=**/*.c,**/*.cpp,**/*.h,**/*.hpp

sonar.exclusions=third_party/**
