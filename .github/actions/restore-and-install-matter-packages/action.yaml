name: Restore and install Matter packages
description: Restore an isolated Conan cache containing Matter packages and install matter_app.

inputs:
  conan-cache-key:
    description: Cache key created by the Matter package producer.
    required: true
  package-version:
    description: Version of matter_app to install from the restored cache.
    required: true
  fail-on-cache-miss:
    description: Fail when the requested package cache does not exist.
    required: false
    default: "true"
  download-parallel:
    description: Maximum parallel Conan downloads after restore.
    required: false
    default: "1"

outputs:
  cache-hit:
    description: Whether the requested Conan cache was restored.
    value: ${{ steps.restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Prepare Conan home
      shell: bash
      run: |
        set -euo pipefail
        : "${CONAN_HOME:?CONAN_HOME must be set (run cache-tools first)}"
        rm -rf "${CONAN_HOME}"
        mkdir -p "${CONAN_HOME}"

    - name: Restore Matter package cache
      id: restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ env.CONAN_HOME }}
        key: ${{ inputs.conan-cache-key }}
        fail-on-cache-miss: ${{ inputs.fail-on-cache-miss }}

    - name: Configure Conan downloads
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p conan-settings
        printf 'core.download:parallel=%s\n' "${{ inputs.download-parallel }}" > conan-settings/global.conf
        conan config install conan-settings --type dir
        rm -rf conan-settings

    - name: Install Matter app package
      shell: bash
      run: |
        set -euo pipefail
        slt install "matter_app/${{ inputs.package-version }}@silabs" -e conan
