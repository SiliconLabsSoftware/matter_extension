name: Cache SDKs
description: Restore simplicity_sdk and wifi_sdk from the base-branch cache. Saves on main/release_*, or on a PR that updates .gitmodules or those submodule pins.

inputs:
    checkout-on-miss:
        description: Checkout and LFS-pull the SDKs when the cache misses (builder jobs). Warm jobs can leave this false; an SDK-pin PR still populates and saves.
        required: false
        default: "true"

outputs:
    cache-key:
        value: ${{ steps.compute-cache-key.outputs.cache-key }}
    cache-hit:
        value: ${{ steps.cache.outputs.cache-hit }}
    sdk-updated:
        value: ${{ steps.compute-cache-key.outputs.sdk-updated }}

runs:
    using: "composite"
    steps:
        - name: Compute SDK cache key
          id: compute-cache-key
          shell: bash
          run: |
              set -euo pipefail

              if [[ "${{ github.event_name }}" == "pull_request" ]]; then
                  SCOPE="${{ github.base_ref }}"
              else
                  SCOPE="${{ github.ref_name }}"
              fi

              SISDK_TAG=$(git config -f .gitmodules --get submodule.third_party/simplicity_sdk.tag)
              SISDK_SHA=$(git rev-parse HEAD:third_party/simplicity_sdk)
              WIFI_SHA=$(git rev-parse HEAD:third_party/wifi_sdk)

              CACHE_KEY="silabs-sdks-${{ runner.os }}-${{ runner.arch }}-${SCOPE}-${SISDK_TAG}-${SISDK_SHA:0:12}-${WIFI_SHA:0:12}"

              SDK_UPDATED=true
              if [[ "${{ github.event_name }}" == "pull_request" ]]; then
                  SDK_UPDATED=false
                  BASE_SHA="${{ github.event.pull_request.base.sha }}"
                  if [[ -n "${BASE_SHA}" ]] && git fetch --depth=1 origin "${BASE_SHA}"; then
                      if git diff --name-only "${BASE_SHA}" HEAD \
                          | grep -qxE '\.gitmodules|third_party/simplicity_sdk|third_party/wifi_sdk'; then
                          SDK_UPDATED=true
                      fi
                  else
                      echo "Could not diff against PR base; treating SDK pins as updated"
                      SDK_UPDATED=true
                  fi
              fi

              echo "cache-key=${CACHE_KEY}" >> "$GITHUB_OUTPUT"
              echo "sdk-updated=${SDK_UPDATED}" >> "$GITHUB_OUTPUT"
              echo "SDK cache key: ${CACHE_KEY}"
              echo "SDK pins updated: ${SDK_UPDATED}"

        - name: Restore SDK cache
          id: cache
          uses: actions/cache/restore@v5
          with:
              path: /tmp/silabs-sdks.tar
              key: ${{ steps.compute-cache-key.outputs.cache-key }}

        - name: Extract SDKs from cache
          if: steps.cache.outputs.cache-hit == 'true'
          shell: bash
          run: |
              set -euo pipefail
              rm -rf third_party/simplicity_sdk third_party/wifi_sdk
              tar -xf /tmp/silabs-sdks.tar
              rm -f /tmp/silabs-sdks.tar
              echo "Restored simplicity_sdk and wifi_sdk from cache"
              du -sh third_party/simplicity_sdk third_party/wifi_sdk

        - name: Checkout SDKs and pull LFS
          if: ${{ steps.cache.outputs.cache-hit != 'true' && (inputs.checkout-on-miss == 'true' || steps.compute-cache-key.outputs.sdk-updated == 'true') }}
          shell: bash
          run: |
              set -euo pipefail
              git lfs install
              GIT_LFS_SKIP_SMUDGE=1 git submodule update --init --depth 1 \
                  third_party/simplicity_sdk third_party/wifi_sdk
              git -C third_party/simplicity_sdk lfs pull
              git -C third_party/wifi_sdk lfs pull
              echo "Checked out simplicity_sdk and wifi_sdk"
              du -sh third_party/simplicity_sdk third_party/wifi_sdk

        - name: Pack SDK working trees
          if: ${{ steps.cache.outputs.cache-hit != 'true' && steps.compute-cache-key.outputs.sdk-updated == 'true' }}
          shell: bash
          run: |
              set -euo pipefail
              tar --exclude='.git' -cf /tmp/silabs-sdks.tar \
                  third_party/simplicity_sdk \
                  third_party/wifi_sdk
              ls -lh /tmp/silabs-sdks.tar

        - name: Save SDK cache
          if: ${{ steps.cache.outputs.cache-hit != 'true' && steps.compute-cache-key.outputs.sdk-updated == 'true' }}
          uses: actions/cache/save@v5
          with:
              path: /tmp/silabs-sdks.tar
              key: ${{ steps.compute-cache-key.outputs.cache-key }}
