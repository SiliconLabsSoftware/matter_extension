name: Cache SDKs
description: Restore simplicity_sdk and wifi_sdk from cache. On miss, checkout, LFS-pull, and save so later jobs reuse it.

inputs:
    working-directory:
        description: Repository root that contains .gitmodules and the SDK submodule paths.
        required: false
        default: "."

outputs:
    cache-key:
        value: ${{ steps.compute-cache-key.outputs.cache-key }}
    cache-hit:
        value: ${{ steps.cache.outputs.cache-hit }}

runs:
    using: "composite"
    steps:
        - name: Compute SDK cache key
          id: compute-cache-key
          shell: bash
          working-directory: ${{ inputs.working-directory }}
          run: |
              set -euo pipefail

              if [[ "${{ github.event_name }}" == "pull_request" ]]; then
                  SCOPE="${{ github.base_ref }}"
              else
                  SCOPE="${{ github.ref_name }}"
              fi

              SISDK_TAG=$(git config -f .gitmodules --get submodule.third_party/simplicity_sdk.tag)
              SISDK_SHA=$(git rev-parse HEAD:third_party/simplicity_sdk)
              WIFI_SHA=$(git rev-parse HEAD:third_party/wifi_sdk)

              CACHE_KEY="silabs-sdks-${{ runner.os }}-${{ runner.arch }}-${SCOPE}-${SISDK_TAG}-${SISDK_SHA:0:12}-${WIFI_SHA:0:12}"

              echo "cache-key=${CACHE_KEY}" >> "$GITHUB_OUTPUT"
              echo "SDK cache key: ${CACHE_KEY}"

        - name: Restore SDK cache
          id: cache
          uses: actions/cache/restore@v5
          with:
              path: /tmp/silabs-sdks.tar
              key: ${{ steps.compute-cache-key.outputs.cache-key }}

        - name: Extract SDKs from cache
          if: steps.cache.outputs.cache-hit == 'true'
          shell: bash
          working-directory: ${{ inputs.working-directory }}
          run: |
              set -euo pipefail
              rm -rf third_party/simplicity_sdk third_party/wifi_sdk
              tar -xf /tmp/silabs-sdks.tar
              rm -f /tmp/silabs-sdks.tar
              echo "Restored simplicity_sdk and wifi_sdk from cache"
              du -sh third_party/simplicity_sdk third_party/wifi_sdk

        - name: Checkout SDKs and pull LFS
          if: steps.cache.outputs.cache-hit != 'true'
          shell: bash
          working-directory: ${{ inputs.working-directory }}
          run: |
              set -euo pipefail
              git lfs install
              GIT_LFS_SKIP_SMUDGE=1 git submodule update --init --depth 1 \
                  third_party/simplicity_sdk third_party/wifi_sdk
              git -C third_party/simplicity_sdk lfs pull
              git -C third_party/wifi_sdk lfs pull
              echo "Checked out simplicity_sdk and wifi_sdk"
              du -sh third_party/simplicity_sdk third_party/wifi_sdk

        - name: Pack SDK working trees
          if: steps.cache.outputs.cache-hit != 'true'
          shell: bash
          working-directory: ${{ inputs.working-directory }}
          run: |
              set -euo pipefail
              tar --exclude='.git' -cf /tmp/silabs-sdks.tar \
                  third_party/simplicity_sdk \
                  third_party/wifi_sdk
              ls -lh /tmp/silabs-sdks.tar

        - name: Save SDK cache
          if: steps.cache.outputs.cache-hit != 'true'
          uses: actions/cache/save@v5
          with:
              path: /tmp/silabs-sdks.tar
              key: ${{ steps.compute-cache-key.outputs.cache-key }}

        - name: Remove SDK tarball
          if: steps.cache.outputs.cache-hit != 'true'
          shell: bash
          run: rm -f /tmp/silabs-sdks.tar
