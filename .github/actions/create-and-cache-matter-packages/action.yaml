name: Create and cache Matter packages
description: Export Matter Conan packages and save their isolated cache for downstream jobs.

inputs:
  package-version:
    description: Version assigned to matter, matter_internal, matter_app, and matter_app_internal packages.
    required: true
  conan-cache-key:
    description: Optional cache key. A run-scoped key is generated when omitted.
    required: false
    default: ""
  prerelease-remote-url:
    description: Conan prerelease remote URL.
    required: false
    default: https://conan-prerelease.silabs.net/

outputs:
  version:
    description: Exported package version.
    value: ${{ steps.create.outputs.version }}
  channel:
    description: Conan channel (from packages/_shared/release_stream_channel).
    value: ${{ steps.create.outputs.channel }}
  conan-cache-key:
    description: Cache key containing the exported packages.
    value: ${{ steps.create.outputs.conan-cache-key }}

runs:
  using: composite
  steps:
    - name: Cache tools
      uses: ./.github/actions/cache-tools

    - name: Configure Conan
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p conan-settings
        printf 'core.download:parallel=6\ncore.upload:parallel=4\n' > conan-settings/global.conf
        conan config install conan-settings --type dir
        rm -rf conan-settings

        conan remote add -f conan-prerelease "${{ inputs.prerelease-remote-url }}"

        slt install cmake || true
        slt install ninja || true

    - name: Export Matter packages
      id: create
      shell: bash
      run: |
        set -euo pipefail
        VERSION="${{ inputs.package-version }}"
        CHANNEL="$(tr -d '[:space:]' < packages/_shared/release_stream_channel)"
        [[ -n "${CHANNEL}" ]] || { echo "error: empty packages/_shared/release_stream_channel" >&2; exit 1; }
        export MATTER_PACKAGE_CHANNEL="${CHANNEL}"
        echo "MATTER_PACKAGE_CHANNEL=${CHANNEL}" >> "$GITHUB_ENV"
        CACHE_KEY="${{ inputs.conan-cache-key }}"
        CACHE_KEY="${CACHE_KEY:-matter-conan-${VERSION}-${CHANNEL}-${{ github.run_id }}-${{ github.run_attempt }}}"

        # name/user default from each conanfile / MatterBaseRecipe; pass version + channel.
        # Drop any prior matter* packages (all versions/channels) before re-export.
        echo "Exporting matter, matter_internal, matter_app, matter_app_internal ${VERSION}@silabs/${CHANNEL}"
        conan remove "matter*/*" -c || true
        conan export-pkg packages/matter/conanfile.py \
          --version="${VERSION}" --channel="${CHANNEL}"
        conan export-pkg packages/matter_internal/conanfile.py \
          --version="${VERSION}" --channel="${CHANNEL}"
        conan export-pkg packages/matter_app/conanfile.py \
          --version="${VERSION}" --channel="${CHANNEL}"
        conan export-pkg packages/matter_app_internal/conanfile.py \
          --version="${VERSION}" --channel="${CHANNEL}"

        conan list "*" -c --format=json | python3 -c '
        import json
        import subprocess
        import sys

        data = json.load(sys.stdin)
        cache = data.get("Local Cache", data)
        allowed = {"matter", "matter_internal", "matter_app", "matter_app_internal"}
        for reference in cache:
            if reference.split("/", 1)[0] not in allowed:
                subprocess.run(["conan", "remove", reference, "-c"], check=False)
        '

        conan list "matter/${VERSION}@silabs/${CHANNEL}:*"
        conan list "matter_internal/${VERSION}@silabs/${CHANNEL}:*"
        conan list "matter_app/${VERSION}@silabs/${CHANNEL}:*"
        conan list "matter_app_internal/${VERSION}@silabs/${CHANNEL}:*"
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
        echo "conan-cache-key=${CACHE_KEY}" >> "$GITHUB_OUTPUT"

    - name: Save Matter package cache
      uses: actions/cache/save@v6
      with:
        path: ${{ env.CONAN_HOME }}
        key: ${{ steps.create.outputs.conan-cache-key }}
