name: Packages Validation

on:
  # Branch runs + daily/Thursday (dispatch). PR gates stay on legacy CI.
  push:
    branches:
      - release_2.10-1.6.1
  workflow_dispatch:
    inputs:
      package_version:
        description: 'MATTER_PACKAGE_VERSION (empty = slc/script/matter_package_version)'
        required: false
        type: string
        default: ''
      build_dev_apps:
        description: 'Build Dev Apps (from package cache)'
        required: false
        type: boolean
        default: true
      ota_size_check:
        description: 'Run OTA flash size check'
        required: false
        type: boolean
        default: true
      use_lockfile:
        description: 'true = locked deps (PR/push/Matter-delta); false = daily resolve + refresh lock'
        required: false
        type: boolean
        default: true

# Separate groups so a locked push/nightly cannot cancel a daily unlock (and
# vice versa). Unlock only via workflow_dispatch with use_lockfile=false.
concurrency:
  group: create-matter-packages-${{ github.head_ref || github.ref_name }}-${{ (github.event_name == 'workflow_dispatch' && inputs.use_lockfile == false) && 'unlock' || 'locked' }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  resolve-deps-mode:
    name: Resolve dependency mode
    runs-on: ubuntu-latest
    outputs:
      use-lockfile: ${{ steps.mode.outputs.use-lockfile }}
    steps:
      - name: Select lockfile mode
        id: mode
        run: |
          set -euo pipefail
          # Refresh (unlocked) only via daily/manual dispatch with use_lockfile=false
          # on release_2.10-1.6.1. Pushes and Matter-delta nightly stay locked.
          ref="${{ github.ref_name }}"
          event="${{ github.event_name }}"
          if [[ "$ref" == "release_2.10-1.6.1" && "$event" == "workflow_dispatch" && "${{ inputs.use_lockfile }}" == "false" ]]; then
            echo "use-lockfile=false" >> "$GITHUB_OUTPUT"
          else
            echo "use-lockfile=true" >> "$GITHUB_OUTPUT"
          fi
          echo "use-lockfile=$(grep '^use-lockfile=' "$GITHUB_OUTPUT" | cut -d= -f2)"

  matter-packages:
    name: Create Matter Packages
    needs: resolve-deps-mode
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.packages.outputs.version }}
      conan-cache-key: ${{ steps.packages.outputs.conan-cache-key }}

    steps:
      - name: Checkout matter_extension
        uses: actions/checkout@v7

      - name: Resolve package version
        id: version
        run: |
          set -euo pipefail
          V="${{ inputs.package_version }}"
          if [[ -z "${V}" ]]; then
            V="$(tr -d '[:space:]' < slc/script/matter_package_version)"
          fi
          echo "package-version=${V}" >> "$GITHUB_OUTPUT"
          echo "Using package version: ${V}"

      - name: Resolve submodule cache key
        id: submodule-key
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          MATTER_SDK=$(git rev-parse :third_party/matter_sdk)
          MATTER_SUPPORT=$(git rev-parse :third_party/matter_support)
          QR=$(git rev-parse :third_party/QR-Code-generator)
          MBEDTLS=$(git rev-parse :third_party/mbedtls)
          NLIO=$(git rev-parse :third_party/nlio)
          NLASSERT=$(git rev-parse :third_party/nlassert)
          echo "cache-key=matter-submodules-${MATTER_SDK}-${MATTER_SUPPORT}-${QR}-${MBEDTLS}-${NLIO}-${NLASSERT}" >> "$GITHUB_OUTPUT"

      - name: Cache Matter submodules
        id: submodule-cache
        uses: actions/cache@v6
        with:
          path: |
            third_party/matter_sdk
            third_party/matter_support
            third_party/QR-Code-generator
            third_party/mbedtls
            third_party/nlio
            third_party/nlassert
          key: ${{ steps.submodule-key.outputs.cache-key }}

      - name: Init Matter submodules
        if: steps.submodule-cache.outputs.cache-hit != 'true'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --depth 1 --jobs 8 \
            third_party/matter_sdk \
            third_party/matter_support \
            third_party/QR-Code-generator \
            third_party/mbedtls \
            third_party/nlio \
            third_party/nlassert

      - name: Create Matter package cache
        id: packages
        uses: ./.github/actions/create-and-cache-matter-packages
        with:
          package-version: ${{ steps.version.outputs.package-version }}

  build-dev-apps:
    name: Build Dev Apps
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_dev_apps }}
    needs: [resolve-deps-mode, matter-packages]
    permissions:
      contents: read
      actions: write
    secrets: inherit
    uses: ./.github/workflows/dev-apps-builder-pkg.yaml
    with:
      build-type: ${{ (github.ref_name == 'release_2.10-1.6.1') && 'full' || 'standard' }}
      package-version: ${{ needs.matter-packages.outputs.version }}
      conan-cache-key: ${{ needs.matter-packages.outputs.conan-cache-key }}
      use-lockfile: ${{ needs.resolve-deps-mode.outputs.use-lockfile == 'true' }}

  ota-size-check:
    name: OTA flash size check
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.ota_size_check }}
    needs: [resolve-deps-mode, matter-packages]
    permissions:
      contents: read
      actions: write
    secrets: inherit
    uses: ./.github/workflows/ota-size-checker-pkg.yaml
    with:
      package-version: ${{ needs.matter-packages.outputs.version }}
      conan-cache-key: ${{ needs.matter-packages.outputs.conan-cache-key }}
      use-lockfile: ${{ needs.resolve-deps-mode.outputs.use-lockfile == 'true' }}

  update-ci-lockfile:
    name: Update CI pkg.lock and conan.lock
    if: ${{ always() && github.ref_name == 'release_2.10-1.6.1' && needs.resolve-deps-mode.outputs.use-lockfile == 'false' && needs.build-dev-apps.result == 'success' && (needs.ota-size-check.result == 'success' || needs.ota-size-check.result == 'skipped') }}
    needs: [resolve-deps-mode, matter-packages, build-dev-apps, ota-size-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Capture from green unlocked lock_app/wifi (siwx-soc) — no second resolve.
      - name: Download unlocked seed pkg.lock
        uses: actions/download-artifact@v7
        with:
          name: ci-unlocked-pkg-lock
          path: ci-pkg-lock-seed

      - name: Promote seed pkg.lock and convert to conan.lock
        run: |
          set -euo pipefail
          LOCK_DIR=".github/pkg-manifest"
          SEED="ci-pkg-lock-seed/pkg.lock"
          [[ -f "${SEED}" ]] || {
            echo "Missing artifact ${SEED} (expected from unlocked lock_app/wifi siwx-soc build)"
            ls -la ci-pkg-lock-seed || true
            exit 1
          }

          mkdir -p "${LOCK_DIR}"
          cp -f "${SEED}" "${LOCK_DIR}/pkg.lock"
          python3 slc/script/pkg_lock_to_conan_lock.py \
            --input "${LOCK_DIR}/pkg.lock" \
            --output "${LOCK_DIR}/conan.lock" \
            --conanfile "${LOCK_DIR}/conanfile.txt"
          echo "Updated ${LOCK_DIR}/pkg.lock and ${LOCK_DIR}/conan.lock from green build seed"
          wc -l "${LOCK_DIR}/pkg.lock" "${LOCK_DIR}/conan.lock"

      - name: Generate GitHub App token
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SILABSSW_MATTER_CI_BOT_APP_ID }}
          private-key: ${{ secrets.SILABSSW_MATTER_CI_BOT_APP_PRIVATE_KEY }}

      - name: Mask the generated token
        run: echo "::add-mask::${{ steps.generate_token.outputs.token }}"

      - name: Create lock refresh pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.generate_token.outputs.token }}
          branch: automation/pkg-manifest-lock-${{ github.ref_name }}
          base: ${{ github.ref_name }}
          delete-branch: true
          title: "NOJIRA: Refresh CI pkg-manifest locks"
          commit-message: "NOJIRA: Refresh CI pkg-manifest locks from unlocked lock_app/wifi build"
          author: "silabs-matter-ci-bot[bot] <209700385+silabs-matter-ci-bot[bot]@users.noreply.github.com>"
          committer: "silabs-matter-ci-bot[bot] <209700385+silabs-matter-ci-bot[bot]@users.noreply.github.com>"
          add-paths: |
            .github/pkg-manifest/pkg.lock
            .github/pkg-manifest/conan.lock
            .github/pkg-manifest/conanfile.txt
          body: |
            Auto-generated after successful unlocked Packages Validation.

            - Source run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - Mode: `use_lockfile=false`
            - Seed: `pkg.lock` captured from green unlocked `lock_app` / `siwx-soc` (wifi) build (no post-green re-resolve)

            Updates:
            - `.github/pkg-manifest/pkg.lock`
            - `.github/pkg-manifest/conan.lock`
            - `.github/pkg-manifest/conanfile.txt`
