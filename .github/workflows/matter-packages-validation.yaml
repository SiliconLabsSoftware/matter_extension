name: Packages Validation

on:
  pull_request:
        branches:
            - main
            - "release_*"
            - feature/package_manager_implementation_phase_2
  workflow_dispatch:
    inputs:
      package_version:
        description: 'MATTER_PACKAGE_VERSION (empty = slc/script/matter_package_version)'
        required: false
        type: string
        default: ''
      build_dev_apps:
        description: 'Build Dev Apps (from package cache)'
        required: false
        type: boolean
        default: true
      ota_size_check:
        description: 'Run OTA flash size check'
        required: false
        type: boolean
        default: true

concurrency:
  group: create-matter-packages-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  matter-packages:
    name: Create Matter Packages
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.packages.outputs.version }}
      conan-cache-key: ${{ steps.packages.outputs.conan-cache-key }}

    steps:
      - name: Checkout matter_extension
        uses: actions/checkout@v7

      - name: Resolve package version
        id: version
        run: |
          set -euo pipefail
          V="${{ inputs.package_version }}"
          if [[ -z "${V}" ]]; then
            V="$(tr -d '[:space:]' < slc/script/matter_package_version)"
          fi
          echo "package-version=${V}" >> "$GITHUB_OUTPUT"
          echo "Using package version: ${V}"

      - name: Resolve submodule cache key
        id: submodule-key
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          MATTER_SDK=$(git rev-parse :third_party/matter_sdk)
          MATTER_SUPPORT=$(git rev-parse :third_party/matter_support)
          QR=$(git rev-parse :third_party/QR-Code-generator)
          MBEDTLS=$(git rev-parse :third_party/mbedtls)
          NLIO=$(git rev-parse :third_party/nlio)
          NLASSERT=$(git rev-parse :third_party/nlassert)
          echo "cache-key=matter-submodules-${MATTER_SDK}-${MATTER_SUPPORT}-${QR}-${MBEDTLS}-${NLIO}-${NLASSERT}" >> "$GITHUB_OUTPUT"

      - name: Cache Matter submodules
        id: submodule-cache
        uses: actions/cache@v6
        with:
          path: |
            third_party/matter_sdk
            third_party/matter_support
            third_party/QR-Code-generator
            third_party/mbedtls
            third_party/nlio
            third_party/nlassert
          key: ${{ steps.submodule-key.outputs.cache-key }}

      - name: Init Matter submodules
        if: steps.submodule-cache.outputs.cache-hit != 'true'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --depth 1 --jobs 8 \
            third_party/matter_sdk \
            third_party/matter_support \
            third_party/QR-Code-generator \
            third_party/mbedtls \
            third_party/nlio \
            third_party/nlassert

      - name: Create Matter package cache
        id: packages
        uses: ./.github/actions/create-and-cache-matter-packages
        with:
          package-version: ${{ steps.version.outputs.package-version }}

  build-dev-apps:
    name: Build Dev Apps
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_dev_apps }}
    needs: matter-packages
    permissions:
      contents: read
      actions: write
    secrets: inherit
    uses: ./.github/workflows/dev-apps-builder-pkg.yaml
    with:
      build-type: ${{ (github.ref_name == 'release_2.10-1.6.1') && 'full' || 'standard' }}
      package-version: ${{ needs.matter-packages.outputs.version }}
      conan-cache-key: ${{ needs.matter-packages.outputs.conan-cache-key }}

  ota-size-check:
    name: OTA flash size check
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.ota_size_check }}
    needs: matter-packages
    permissions:
      contents: read
      actions: write
    secrets: inherit
    uses: ./.github/workflows/ota-size-checker-pkg.yaml
    with:
      package-version: ${{ needs.matter-packages.outputs.version }}
      conan-cache-key: ${{ needs.matter-packages.outputs.conan-cache-key }}
      use-lockfile: ${{ needs.resolve-deps-mode.outputs.use-lockfile == 'true' }}

  update-ci-lockfile:
    name: Update CI pkg.lock and conan.lock
    if: ${{ always() && needs.resolve-deps-mode.outputs.use-lockfile == 'false' && needs.build-dev-apps.result == 'success' && (needs.ota-size-check.result == 'success' || needs.ota-size-check.result == 'skipped') }}
    needs: [resolve-deps-mode, matter-packages, build-dev-apps, ota-size-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache tools
        uses: ./.github/actions/cache-tools

      - name: Install Matter packages (no CI lock)
        uses: ./.github/actions/install-pkg-manifest
        with:
          conan-cache-key: ${{ needs.matter-packages.outputs.conan-cache-key }}
          package-version: ${{ needs.matter-packages.outputs.version }}
          use-lockfile: "false"

      - name: Resolve pkg.lock and convert to conan.lock
        env:
          MATTER_PACKAGE_VERSION: ${{ needs.matter-packages.outputs.version }}
        run: |
          set -euo pipefail
          APP_DIR="slc/apps/lock_app/wifi"
          LOCK_DIR=".github/pkg-manifest"
          [[ -f "${APP_DIR}/pkg.slt" ]] || python3 slc/script/generate_pkg_slt.py -d slc

          # Fresh resolve: remove old lock so slt install floats.
          rm -f "${APP_DIR}/pkg.lock"
          (
            cd "${APP_DIR}"
            echo "Running unlocked slt install in ${APP_DIR}"
            slt install --check-updates=true
          )
          [[ -f "${APP_DIR}/pkg.lock" ]] || {
            echo "slt install did not produce ${APP_DIR}/pkg.lock"
            exit 1
          }

          mkdir -p "${LOCK_DIR}"
          cp -f "${APP_DIR}/pkg.lock" "${LOCK_DIR}/pkg.lock"
          python3 slc/script/pkg_lock_to_conan_lock.py \
            --input "${LOCK_DIR}/pkg.lock" \
            --output "${LOCK_DIR}/conan.lock" \
            --conanfile "${LOCK_DIR}/conanfile.txt"
          echo "Updated ${LOCK_DIR}/pkg.lock and ${LOCK_DIR}/conan.lock"
          wc -l "${LOCK_DIR}/pkg.lock" "${LOCK_DIR}/conan.lock"

      - name: Commit updated lockfiles
        run: |
          set -euo pipefail
          git config user.name "matter-ci-bot"
          git config user.email "matter-ci-bot@users.noreply.github.com"
          git add .github/pkg-manifest/pkg.lock \
                  .github/pkg-manifest/conan.lock \
                  .github/pkg-manifest/conanfile.txt
          if git diff --staged --quiet; then
            echo "No lockfile changes"
            exit 0
          fi
          git commit -m "NOJIRA: Refresh CI pkg-manifest locks from nightly slt resolve"
          git push
