name: Notify dev app build failure

# workflow_run always uses this file from the default branch.
# Pull request workflows cannot change the step that reads the webhook.
on:
  push:
  workflow_run:
    workflows: ["Build Dev apps"]
    types: [completed]
    branches:
      - main
      - release_*

permissions: {}

jobs:
  slack:
    name: Post Slack failure
    # Nightly builds dispatch this workflow, so they use workflow_dispatch too.
    # A dispatch on main or release_* is a full build.
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Post failure to Slack
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "Build Dev apps failed on ${{ github.event.workflow_run.head_branch }} (${{ github.event.workflow_run.actor.login }}): ${{ github.event.workflow_run.html_url }}"
