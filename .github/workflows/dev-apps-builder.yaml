name: Build Dev apps

# Test-branch trim: Wi-Fi SoC PSRAM matrix only (lighting + lock).
# Flavors split across 8 JSON shards, run in parallel:
#   .github/silabs-builds-siwx-psram-{1..8}.json
#   brd4342a x gcc / llvm / gcc-lto / llvm-lto (+ every text/data/bss combo)

on:
    pull_request:
        branches:
            - main
            - "release_*"
    workflow_dispatch:
        inputs:
            build-type:
                description: "The build type to use"
                required: true
                type: choice
                options:
                    - standard
                    - full

concurrency:
    group: dev-build-examples-${{ github.ref }}
    cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
    set-build-type:
        runs-on: ubuntu-latest
        outputs:
            build-type: ${{ steps.set-build-type.outputs.build-type }}
        steps:
            - name: Set build-type based on event
              id: set-build-type
              run: |
                  if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
                      if [[ "${{ github.ref_name }}" == "main" || "${{ github.ref_name }}" =~ ^release_ ]]; then
                          echo "build-type=full" >> $GITHUB_OUTPUT
                      else
                          echo "build-type=${{ github.event.inputs.build-type }}" >> $GITHUB_OUTPUT
                      fi
                  elif [[ "${{ github.event_name }}" == "schedule" ]]; then
                      echo "build-type=full" >> $GITHUB_OUTPUT
                  elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
                      echo "build-type=standard" >> $GITHUB_OUTPUT
                  fi

    cache-tools:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: write
        outputs:
            cache-key: ${{ steps.cache-tools.outputs.cache-key }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - uses: ./.github/actions/cache-tools
              id: cache-tools

    cache-sdks:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: write
        outputs:
            cache-key: ${{ steps.cache-sdks.outputs.cache-key }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  submodules: false
            - uses: ./.github/actions/cache-sdks
              id: cache-sdks

    build_psram:
        name: ${{ matrix.example-app }} psram-${{ matrix.shard }}
        needs: [set-build-type, cache-tools, cache-sdks]
        strategy:
            fail-fast: false
            matrix:
                example-app: [lighting_app, lock_app]
                shard: [1, 2, 3, 4, 5, 6, 7, 8]
        uses: ./.github/workflows/builder.yaml
        with:
            json-file-path: './.github/silabs-builds-siwx-psram-${{ matrix.shard }}.json'
            path-to-example-app: slc/apps/${{ matrix.example-app }}/wifi/matter_wifi_soc_${{ matrix.example-app }}_freertos.slcw
            example-app: ${{ matrix.example-app }}
            build-type: ${{ needs.set-build-type.outputs.build-type }}
            platform: siwx-soc-psram-${{ matrix.example-app }}-${{ matrix.shard }}

    merge-apps:
        name: Merge App Artifacts
        runs-on: ubuntu-latest
        needs:
            - set-build-type
            - cache-tools
            - cache-sdks
            - build_psram
        if: success()

        steps:
            - name: Merge artifacts
              uses: actions/upload-artifact/merge@v7
              with:
                  name: "dev-artifacts-${{ needs.set-build-type.outputs.build-type }}"
                  delete-merged: true
                  pattern: "*-${{ needs.set-build-type.outputs.build-type }}"

    delete-cache:
        name: Delete tools cache
        needs: [merge-apps, cache-tools]
        if: always()
        runs-on: ubuntu-latest
        permissions:
            actions: write
        steps:
            - name: Delete tools cache
              run: |
                curl -s -X DELETE \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                  "https://api.github.com/repos/${{ github.repository }}/actions/caches?key=${{ needs.cache-tools.outputs.cache-key }}"
