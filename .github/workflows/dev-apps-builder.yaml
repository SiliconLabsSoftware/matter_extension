name: Build Dev apps

on:
    pull_request:
        branches:
            - main
            - "release_*"
    workflow_dispatch:
        inputs:
            build-type:
                description: "The build type to use"
                required: true
                type: choice
                options:
                    - standard
                    - full

concurrency:
    group: dev-build-examples-${{ github.ref }}
    cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
    set-build-type:
        runs-on: ubuntu-latest
        outputs:
            build-type: ${{ steps.set-build-type.outputs.build-type }}
        steps:
            - name: Set build-type based on event
              id: set-build-type
              run: |
                  if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
                      if [[ "${{ github.ref_name }}" == "main" || "${{ github.ref_name }}" =~ ^release_ ]]; then
                          echo "build-type=full" >> $GITHUB_OUTPUT
                      else
                          echo "build-type=${{ github.event.inputs.build-type }}" >> $GITHUB_OUTPUT
                      fi
                  elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
                      echo "build-type=standard" >> $GITHUB_OUTPUT
                  else
                      # push / other events on test branches
                      echo "build-type=full" >> $GITHUB_OUTPUT
                  fi

    build_coverage:
        name: Build Coverage
        needs:
            - set-build-type
        uses: ./.github/workflows/coverage-builder.yaml
        with:
            build-type: ${{ needs.set-build-type.outputs.build-type }}
