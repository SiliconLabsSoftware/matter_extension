name: Build Dev apps

# Test-branch trim: Wi-Fi SoC PSRAM matrix only (lighting + lock).
# Boards/flavors live in .github/silabs-builds-siwx.json
#   brd4342a + brd4343s x gcc / llvm / gcc-lto / llvm-lto (+ psram-text-data)

on:
    pull_request:
        branches:
            - main
            - "release_*"
    workflow_dispatch:
        inputs:
            build-type:
                description: "The build type to use"
                required: true
                type: choice
                options:
                    - standard
                    - full

concurrency:
    group: dev-build-examples-${{ github.ref }}
    cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
    set-build-type:
        runs-on: ubuntu-latest
        outputs:
            build-type: ${{ steps.set-build-type.outputs.build-type }}
        steps:
            - name: Set build-type based on event
              id: set-build-type
              run: |
                  if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
                      if [[ "${{ github.ref_name }}" == "main" || "${{ github.ref_name }}" =~ ^release_ ]]; then
                          echo "build-type=full" >> $GITHUB_OUTPUT
                      else
                          echo "build-type=${{ github.event.inputs.build-type }}" >> $GITHUB_OUTPUT
                      fi
                  elif [[ "${{ github.event_name }}" == "schedule" ]]; then
                      echo "build-type=full" >> $GITHUB_OUTPUT
                  elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
                      echo "build-type=standard" >> $GITHUB_OUTPUT
                  fi

    cache-tools:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: write
        outputs:
            cache-key: ${{ steps.cache-tools.outputs.cache-key }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - uses: ./.github/actions/cache-tools
              id: cache-tools

    cache-sdks:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: write
        outputs:
            cache-key: ${{ steps.cache-sdks.outputs.cache-key }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  submodules: false
            - uses: ./.github/actions/cache-sdks
              id: cache-sdks

    build_lighting_app:
        name: Build Lighting App (SiWx PSRAM)
        needs: [set-build-type, cache-tools, cache-sdks]
        uses: ./.github/workflows/platform-builder.yaml
        with:
            example-app: "lighting_app"
            build-type: ${{ needs.set-build-type.outputs.build-type }}
            thread-support: false
            wifi-soc-support: true
            ncp-917-support: false
            trustzone-support: false

    build_lock_app:
        name: Build Lock App (SiWx PSRAM)
        needs: [set-build-type, cache-tools, cache-sdks]
        uses: ./.github/workflows/platform-builder.yaml
        with:
            example-app: "lock_app"
            build-type: ${{ needs.set-build-type.outputs.build-type }}
            thread-support: false
            wifi-soc-support: true
            ncp-917-support: false
            trustzone-support: false

    merge-apps:
        name: Merge App Artifacts
        runs-on: ubuntu-latest
        needs:
            - set-build-type
            - cache-tools
            - cache-sdks
            - build_lighting_app
            - build_lock_app
        if: success()

        steps:
            - name: Merge artifacts
              uses: actions/upload-artifact/merge@v7
              with:
                  name: "dev-artifacts-${{ needs.set-build-type.outputs.build-type }}"
                  delete-merged: true
                  pattern: "*-${{ needs.set-build-type.outputs.build-type }}"

    delete-cache:
        name: Delete tools cache
        needs: [merge-apps, cache-tools]
        if: always()
        runs-on: ubuntu-latest
        permissions:
            actions: write
        steps:
            - name: Delete tools cache
              run: |
                curl -s -X DELETE \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                  "https://api.github.com/repos/${{ github.repository }}/actions/caches?key=${{ needs.cache-tools.outputs.cache-key }}"
