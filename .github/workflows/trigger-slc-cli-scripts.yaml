name: Trigger SLC CLI Scripts

on:
  schedule:
    # main and release_2.10-1.6.1: Monday 8:05 pm EDT
    - cron: "5 0 * * 2"
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to run slc-cli-scripts.yml on
        required: true
        default: release_2.10-1.6.1
        type: string

permissions:
  actions: write
  contents: read

jobs:
  plan:
    name: Select target branches
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.set.outputs.targets }}
    steps:
      - name: Map event to branches
        id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'targets=["${{ inputs.branch }}"]' >> "$GITHUB_OUTPUT"
          else
            echo 'targets=["main","release_2.10-1.6.1"]' >> "$GITHUB_OUTPUT"
          fi

  trigger_slc_cli_scripts:
    name: Trigger SLC CLI Scripts (${{ matrix.branch }})
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.plan.outputs.targets) }}
    steps:
      - name: Trigger slc-cli-scripts.yml on ${{ matrix.branch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ matrix.branch }}
        run: |
          set -euo pipefail
          echo "Triggering slc-cli-scripts.yml on branch $BRANCH"

          response=$(curl -s -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/slc-cli-scripts.yml/dispatches" \
            -d "{\"ref\":\"$BRANCH\"}")

          http_code="${response: -3}"
          response_body="${response%???}"

          if [ "$http_code" = "204" ]; then
            echo "Successfully triggered slc-cli-scripts.yml on $BRANCH"
            echo "Timestamp: $(date -u)"
          else
            echo "Failed to trigger workflow. HTTP code: $http_code"
            echo "Response: $response_body"
            exit 1
          fi
