name: Build Zephyr All-Devices App

on:
  push:
    branches:
      - main
      - "release_*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CHIP_LOG_TIMESTAMPS: false

jobs:
  setup:
    name: Prepare Zephyr workspace
    runs-on: ubuntu-latest
    if: github.actor != 'restyled-io[bot]'
    container:
      image: ghcr.io/zephyrproject-rtos/zephyr-build:v0.29.4
      options: --user root

    steps:
      - name: Resolve pinned Matter SDK revision
        id: sdk
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const { data } = await github.rest.repos.getContent({
              ...context.repo,
              path: 'third_party/matter_sdk',
              ref: context.sha,
            });
            if (Array.isArray(data) || !data.submodule_git_url) {
              throw new Error('Expected matter_sdk to be a submodule');
            }
            core.setOutput('sha', data.sha);

      - name: Checkout Matter SDK
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: SiliconLabsSoftware/matter_sdk
          ref: ${{ steps.sdk.outputs.sha }}
          persist-credentials: false

      - name: Set up Zephyr workspace
        shell: bash
        # Instead of main, replace with the official 4.5 tag once created.
        run: |
          set -euxo pipefail
          west init -m https://github.com/SiliconLabsSoftware/zephyr-silabs --mr main /tmp/zephyrproject
          cd /tmp/zephyrproject
          west update
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" submodule update --init --depth 1 --jobs 4 -- \
              third_party/editline/repo \
              third_party/jsoncpp/repo \
              third_party/nlassert/repo \
              third_party/nlio/repo \
              third_party/uriparser/repo \
              third_party/pigweed/repo
          : > "$GITHUB_WORKSPACE/build_overrides/pigweed_environment.gni"
          west blobs fetch hal_silabs

      - name: Install GN from Matter's pinned CIPD version
        shell: bash
        working-directory: /tmp/zephyrproject
        run: |
          set -euxo pipefail
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git /opt/depot_tools
          gn_version="$(python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          config = Path(os.environ["GITHUB_WORKSPACE"]) / "third_party/pigweed/repo/pw_env_setup/py/pw_env_setup/cipd_setup/pigweed.json"
          packages = json.loads(config.read_text())["packages"]
          gn = next(package for package in packages if package["path"] == "gn/gn/${platform}")
          print(gn["tags"][0])
          PY
          )"
          /opt/depot_tools/cipd install gn/gn/linux-amd64 "$gn_version" -root /opt/gn
          /opt/gn/gn --version

      - name: Archive prepared workspaces
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/ci-transfer
          tar -C "$GITHUB_WORKSPACE" -czf /tmp/ci-transfer/matter.tar.gz .
          tar -C /tmp -czf /tmp/ci-transfer/zephyrproject.tar.gz zephyrproject
          tar -C /opt -czf /tmp/ci-transfer/gn.tar.gz gn

      - name: Upload prepared workspaces
        uses: actions/upload-artifact@v7
        with:
          name: zephyr-prepared-workspaces
          path: /tmp/ci-transfer/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  zephyr:
    name: all-devices-app (${{ matrix.board }}, ${{ matrix.toolchain }})
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: xg26_rb4118a
            toolchain: zephyr
            build_dir: all-devices-zephyr-xg26-gcc
            extra_args: -DFILE_SUFFIX=debug
            main_release_only: false
          # Add the other board entries here.
    container:
      image: ghcr.io/zephyrproject-rtos/zephyr-build:v0.29.4
      options: --user root

    steps:
      - name: Download prepared workspaces
        if: ${{ !matrix.main_release_only || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release_') }}
        uses: actions/download-artifact@v7
        with:
          name: zephyr-prepared-workspaces
          path: /tmp/ci-transfer

      - name: Restore prepared workspaces
        if: ${{ !matrix.main_release_only || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release_') }}
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/zephyrproject /opt/gn "$GITHUB_WORKSPACE"
          tar -C "$GITHUB_WORKSPACE" -xzf /tmp/ci-transfer/matter.tar.gz
          tar -C /tmp -xzf /tmp/ci-transfer/zephyrproject.tar.gz
          tar -C /opt -xzf /tmp/ci-transfer/gn.tar.gz
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo '/opt/gn' >> "$GITHUB_PATH"

      - name: Build All-Devices App
        if: ${{ !matrix.main_release_only || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release_') }}
        shell: bash
        working-directory: /tmp/zephyrproject
        env:
          ZEPHYR_TOOLCHAIN_VARIANT: ${{ matrix.toolchain }}
          ZEPHYR_SDK_INSTALL_DIR: /opt/toolchains/zephyr-sdk-1.0.1
        run: |
          west build -p always -b "${{ matrix.board }}" --sysbuild \
            "${GITHUB_WORKSPACE}/examples/all-devices-app/zephyr" \
            -d "build/${{ matrix.build_dir }}" \
            -- \
            -DZEPHYR_TOOLCHAIN_VARIANT="${ZEPHYR_TOOLCHAIN_VARIANT}" \
            -DZEPHYR_EXTRA_MODULES="${GITHUB_WORKSPACE}" \
            "${{ matrix.extra_args }}"

      - name: Export Zephyr HEX
        if: ${{ !matrix.main_release_only || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release_') }}
        shell: bash
        run: |
          set -euxo pipefail
          artifact_dir="artifacts/all-devices-app-zephyr/${{ matrix.board }}"
          mkdir -p "$artifact_dir"
          cp "/tmp/zephyrproject/build/${{ matrix.build_dir }}/zephyr/zephyr/zephyr.hex" \
              "$artifact_dir/zephyr.hex"

      - name: Upload Zephyr binary artifacts
        if: ${{ !matrix.main_release_only || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release_') }}
        uses: actions/upload-artifact@v7
        with:
          name: dev-artifacts-zephyr-${{ matrix.board }}-${{ matrix.toolchain }}
          path: artifacts/
          if-no-files-found: error
