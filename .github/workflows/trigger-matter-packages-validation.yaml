name: Trigger Matter Packages Validation

on:
  schedule:
    # release_2.10-1.6.1: 8:05 am EDT daily
    - cron: "5 12 * * *"

permissions:
  actions: write
  contents: read

jobs:
  trigger_matter_packages_validation:
    name: Trigger Matter Packages Validation (${{ matrix.branch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: [release_2.10-1.6.1]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Check whether a build should run
        id: should_trigger
        env:
          BRANCH: ${{ matrix.branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          since="24 hours ago"
          rev_list_args=(--since="$since" HEAD)
          commit_count=$(git rev-list --count "${rev_list_args[@]}")
          echo "Commits on $BRANCH since $since: $commit_count"
          if [[ "$commit_count" -gt 0 ]]; then
            git log --oneline -n 10 "${rev_list_args[@]}"
            has_changes=true
          else
            echo "No commits since $since. Skipping build trigger."
            has_changes=false
          fi

          if [[ "$has_changes" != "true" ]]; then
            echo "should_trigger=false" >> "$GITHUB_OUTPUT"
            echo "reason=no_delta" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Skip if Matter Packages Validation is already queued or in progress on this branch.
          active=0
          for status in in_progress queued; do
            count=$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow=matter-packages-validation.yaml \
              --branch "$BRANCH" \
              --status "$status" \
              --json databaseId \
              --jq 'length')
            echo "matter-packages-validation.yaml $status=$count on $BRANCH"
            active=$((active + count))
          done

          if [[ "$active" -gt 0 ]]; then
            echo "Matter Packages Validation already active on $BRANCH, skipping trigger to avoid canceling it."
            echo "should_trigger=false" >> "$GITHUB_OUTPUT"
            echo "reason=busy" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_trigger=true" >> "$GITHUB_OUTPUT"
          echo "reason=ok" >> "$GITHUB_OUTPUT"

      - name: Trigger Matter Packages Validation on ${{ matrix.branch }}
        if: steps.should_trigger.outputs.should_trigger == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ matrix.branch }}
        run: |
          echo "Triggering matter-packages-validation.yaml on branch $BRANCH"

          response=$(curl -s -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/matter-packages-validation.yaml/dispatches" \
            -d "{\"ref\":\"$BRANCH\",\"inputs\":{\"build_dev_apps\":true,\"ota_size_check\":true}}")

          http_code="${response: -3}"
          response_body="${response%???}"

          if [ "$http_code" = "204" ]; then
            echo "Successfully triggered matter-packages-validation.yaml on $BRANCH"
            echo "Timestamp: $(date -u)"
          else
            echo "Failed to trigger workflow. HTTP code: $http_code"
            echo "Response: $response_body"
            exit 1
          fi
