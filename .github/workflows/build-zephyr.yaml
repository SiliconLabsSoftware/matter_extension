name: Build Zephyr

on:
  push:
    branches:
      - main
      - "release_*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  CHIP_LOG_TIMESTAMPS: false
  PW_ENVIRONMENT_ROOT: ${{ github.workspace }}/.environment

jobs:
  zephyr-lighting-app:
    name: Lighting App

    runs-on: ubuntu-latest
    if: github.actor != 'restyled-io[bot]'

    container:
      image: ghcr.io/project-chip/chip-build-silabs-zephyr:202
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Mark repository as safe for Git
        shell: bash
        run: |
          git config --global --add safe.directory '*'

      - name: Initialize matter_sdk submodule
        shell: bash
        run: |
          git submodule update --init third_party/matter_sdk

      - name: Checkout matter_sdk silabs submodules
        shell: bash
        run: |
          cd third_party/matter_sdk
          ./scripts/checkout_submodules.py --shallow --platform silabs_docker

      - name: Bootstrap
        uses: SiliconLabsSoftware/matter_build_action/bootstrap@v2
        with:
          platform: silabs_docker

      # - name: Build SiWx917 Zephyr Lighting App
      #   shell: bash
      #   run: |
      #     cd third_party/matter_sdk && ./scripts/run_in_build_env.sh \
      #        "cd /opt/silabs/zephyr-silabs \
      #         && west build -b siwx917_rb4338a -p always ${GITHUB_WORKSPACE}/third_party/matter_sdk/examples/lighting-app/silabs/zephyr"

      # - name: Export SiWx917 Zephyr RPS
      #   shell: bash
      #   run: |
      #     mkdir -p artifacts/lighting-app-zephyr/BRD4338A
      #     cp /opt/silabs/zephyr-silabs/build/zephyr/zephyr.rps \
      #        artifacts/lighting-app-zephyr/BRD4338A/matter_wifi_soc_lighting_app_zephyr.rps

      # - name: Build EFR32xG24 Zephyr Lighting App
      #   shell: bash
      #   run: |
      #     cd third_party/matter_sdk && ./scripts/run_in_build_env.sh \
      #        "cd /opt/silabs/zephyr-silabs \
      #         && west build -b xg24_rb4187c -p always ${GITHUB_WORKSPACE}/third_party/matter_sdk/examples/lighting-app/silabs/zephyr"

      # - name: Export EFR32xG24 Zephyr HEX
      #   shell: bash
      #   run: |
      #     mkdir -p artifacts/lighting-app-zephyr/BRD4187C
      #     cp /opt/silabs/zephyr-silabs/build/zephyr/zephyr.hex \
      #        artifacts/lighting-app-zephyr/BRD4187C/matter_thread_soc_lighting_app_series_2_zephyr_full.hex

      # The all-devices-app builds MCUboot through sysbuild. zephyr-silabs signs
      # MCUboot with Simplicity Commander (zephyr/cmake/commander_sign.cmake,
      # triggered by CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256). Commander ships
      # with Simplicity Studio, not with the Zephyr SDK or the Matter
      # bootstrap, so it has to be installed here.
      # FindSimplicityCommander.cmake resolves it from PATH.
      #
      # TEMPORARY: SLT (SiliconLabsSoftware/action-setup-slt and the slt-cli
      # zips) is unavailable, so Commander is downloaded directly, as
      # zephyr-silabs documents in doc/getting-started-linux.md. Restore the
      # commented-out SLT steps below (matching
      # .github/actions/install-tools) once SLT is back.
      - name: Install Simplicity Commander
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://www.silabs.com/documents/login/software/SimplicityCommander-Linux.zip -O /tmp/commander.zip
          unzip -q /tmp/commander.zip -d /tmp
          # Unpacks to /opt/commander/commander. The full Commander is needed:
          # commander_sign.cmake calls "convert --secureboot --keyfile".
          tar -C /opt -xf /tmp/SimplicityCommander-Linux/Commander_linux_x86_64_*.tar.bz
          rm -rf /tmp/commander.zip /tmp/SimplicityCommander-Linux
          echo /opt/commander >> "$GITHUB_PATH"
          echo "COMMANDER_PATH=/opt/commander" >> "$GITHUB_ENV"
          /opt/commander/commander --version

      # - name: Setup SLT
      #   id: setup-slt
      #   uses: SiliconLabsSoftware/action-setup-slt@v2

      # - name: Install Simplicity Commander
      #   shell: bash
      #   run: |
      #     set -euo pipefail
      #     echo "${{ steps.setup-slt.outputs.slt-path }}" >> "$GITHUB_PATH"
      #     export PATH="${{ steps.setup-slt.outputs.slt-path }}:${PATH}"
      #     slt install commander
      #     COMMANDER_PATH="$(slt where commander)"
      #     echo "COMMANDER_PATH=${COMMANDER_PATH}" >> "$GITHUB_ENV"
      #     echo "${COMMANDER_PATH}" >> "$GITHUB_PATH"

      # The all-devices-app requires Matter to be registered as a Zephyr module.
      # The zephyr-silabs manifest in the container does not include it, so the
      # local matter_sdk checkout is passed as an extra module. The "zephyr_"
      # prefix scopes the variable to the sysbuild application image, which is
      # named after the app directory (examples/all-devices-app/zephyr).
      - name: Build EFR32xG26 Zephyr All-Devices App
        shell: bash
        run: |
          cd third_party/matter_sdk && ./scripts/run_in_build_env.sh \
             "cd /opt/silabs/zephyr-silabs \
              && west build -b xg26_rb4118a -p always --sysbuild \
                   ${GITHUB_WORKSPACE}/third_party/matter_sdk/examples/all-devices-app/zephyr \
                   -d /opt/silabs/zephyr-silabs/build-all-devices-xg26 \
                   -- -DUSE_CCACHE=0 \
                      -Dzephyr_EXTRA_ZEPHYR_MODULES=${GITHUB_WORKSPACE}/third_party/matter_sdk"

      - name: Export EFR32xG26 Zephyr All-Devices HEX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/all-devices-app-zephyr/BRD4118A
          # sysbuild merges MCUboot and the signed app into merged_<board_target>.hex
          merged=(/opt/silabs/zephyr-silabs/build-all-devices-xg26/merged_*.hex)
          if [ ${#merged[@]} -ne 1 ]; then
            echo "Expected exactly one merged hex, found: ${merged[*]}" >&2
            exit 1
          fi
          cp "${merged[0]}" \
             artifacts/all-devices-app-zephyr/BRD4118A/matter_thread_soc_all_devices_app_series_2_zephyr_full.hex

      - name: Upload Zephyr binary artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dev-artifacts-zephyr
          path: artifacts/
          if-no-files-found: error
