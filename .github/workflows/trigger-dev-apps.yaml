name: Trigger Dev Apps Build

on:
  schedule:
    # release: 8:05 pm EDT daily
    - cron: "5 0 * * *"
    # main: Thursday at 8:05 pm EDT
    - cron: "5 0 * * 5"

permissions:
  actions: write
  contents: read

jobs:
  plan:
    name: Select target branches
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.set.outputs.targets }}
    steps:
      - name: Map schedule to branches
        id: set
        run: |
          case "${{ github.event.schedule }}" in
            "5 0 * * *")
              echo 'targets=["release_2.9-1.6"]' >> "$GITHUB_OUTPUT" # TODO: add release_2.10-1.6.1 when nightlies are wanted for it
              echo "Daily schedule: release"
              ;;
            "5 0 * * 5")
              echo 'targets=["main"]' >> "$GITHUB_OUTPUT"
              echo "Weekly schedule: main"
              ;;
            *)
              echo "Unrecognized schedule '${{ github.event.schedule }}'; no targets" >&2
              echo 'targets=[]' >> "$GITHUB_OUTPUT"
              ;;
          esac

  trigger_dev_apps_build:
    name: Trigger Dev Apps Build (${{ matrix.branch }})
    needs: plan
    if: needs.plan.outputs.targets != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.plan.outputs.targets) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Check whether a build should run
        id: should_trigger
        env:
          BRANCH: ${{ matrix.branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Weekly main: always attempt a full build.
          # Daily release: only if commits landed in the last 24 hours.
          if [[ "$BRANCH" == "main" ]]; then
            echo "Branch is main, skipping delta check"
            has_changes=true
          else
            commit_count=$(git rev-list --count --since="24 hours ago" HEAD 2>/dev/null || echo "0")
            echo "Commits in last 24 hours on $BRANCH: $commit_count"
            if [[ "$commit_count" -gt 0 ]]; then
              echo "Found $commit_count commit(s) in the last 24 hours."
              git log --since="24 hours ago" --oneline | head -10
              has_changes=true
            else
              echo "No commits found in the last 24 hours. Skipping build trigger."
              has_changes=false
            fi
          fi

          if [[ "$has_changes" != "true" ]]; then
            echo "should_trigger=false" >> "$GITHUB_OUTPUT"
            echo "reason=no_delta" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Skip if Build Dev apps is already queued or in progress on this branch.
          in_progress=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow=dev-apps-builder.yaml \
            --branch "$BRANCH" \
            --status in_progress \
            --json databaseId \
            --jq 'length')
          queued=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow=dev-apps-builder.yaml \
            --branch "$BRANCH" \
            --status queued \
            --json databaseId \
            --jq 'length')

          echo "in_progress=$in_progress queued=$queued on $BRANCH"
          if [[ "$in_progress" -gt 0 || "$queued" -gt 0 ]]; then
            echo "Build Dev apps already active on $BRANCH, skipping trigger to avoid canceling it."
            echo "should_trigger=false" >> "$GITHUB_OUTPUT"
            echo "reason=busy" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_trigger=true" >> "$GITHUB_OUTPUT"
          echo "reason=ok" >> "$GITHUB_OUTPUT"

      - name: Trigger Dev Apps Build on ${{ matrix.branch }}
        if: steps.should_trigger.outputs.should_trigger == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ matrix.branch }}
          BUILD_TYPE: "full"
        run: |
          echo "Triggering dev-apps-builder.yaml on branch $BRANCH with build-type $BUILD_TYPE"

          response=$(curl -s -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/dev-apps-builder.yaml/dispatches" \
            -d "{\"ref\":\"$BRANCH\",\"inputs\":{\"build-type\":\"$BUILD_TYPE\"}}")

          http_code="${response: -3}"
          response_body="${response%???}"

          if [ "$http_code" = "204" ]; then
            echo "Successfully triggered dev-apps-builder.yaml on $BRANCH"
            echo "Build type: $BUILD_TYPE"
            echo "Timestamp: $(date -u)"
          else
            echo "Failed to trigger workflow. HTTP code: $http_code"
            echo "Response: $response_body"
            exit 1
          fi
