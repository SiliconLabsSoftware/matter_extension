name: Trigger Dev Apps Build

on:
  schedule:
    # release_2.9-1.6: 8:05 pm EDT daily
    - cron: "5 0 * * *"
    # release_2.10-1.6.1: 8:05 am EDT daily
    - cron: "5 12 * * *"
    # main: Thursday at 8:05 pm EDT (biweekly; gated in plan job)
    - cron: "5 0 * * 5"

permissions:
  actions: write
  contents: read

jobs:
  plan:
    name: Select target branches
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.set.outputs.targets }}
    steps:
      - name: Map schedule to branches
        id: set
        run: |
          case "${{ github.event.schedule }}" in
            "5 0 * * *")
              echo 'targets=["release_2.9-1.6"]' >> "$GITHUB_OUTPUT"
              echo "Daily schedule: release_2.9-1.6"
              ;;
            "5 12 * * *")
              echo 'targets=["release_2.10-1.6.1"]' >> "$GITHUB_OUTPUT"
              echo "Daily schedule: release_2.10-1.6.1"
              ;;
            "5 0 * * 5")
              week=$(date -u +%V)
              if (( 10#$week % 2 == 0 )); then
                echo 'targets=["main"]' >> "$GITHUB_OUTPUT"
                echo "Biweekly schedule: main (week $week)"
              else
                echo 'targets=[]' >> "$GITHUB_OUTPUT"
                echo "Skipping main this week (week $week)"
              fi
              ;;
            *)
              echo "Unrecognized schedule '${{ github.event.schedule }}'; no targets" >&2
              echo 'targets=[]' >> "$GITHUB_OUTPUT"
              ;;
          esac

  trigger_dev_apps_build:
    name: Trigger Dev Apps Build (${{ matrix.branch }})
    needs: plan
    if: needs.plan.outputs.targets != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.plan.outputs.targets) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Check whether a build should run
        id: should_trigger
        env:
          BRANCH: ${{ matrix.branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ "$BRANCH" == "main" ]]; then
            since="7 days ago"
          else
            since="24 hours ago"
          fi

          rev_list_args=(--since="$since" HEAD)
          commit_count=$(git rev-list --count "${rev_list_args[@]}")
          echo "Commits on $BRANCH since $since: $commit_count"
          if [[ "$commit_count" -gt 0 ]]; then
            git log --oneline -n 10 "${rev_list_args[@]}"
            has_changes=true
          else
            echo "No commits since $since. Skipping build trigger."
            has_changes=false
          fi

          if [[ "$has_changes" != "true" ]]; then
            echo "should_trigger=false" >> "$GITHUB_OUTPUT"
            echo "reason=no_delta" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Skip if Build Dev apps is already queued or in progress on this branch.
          active=0
          for status in in_progress queued; do
            count=$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow=dev-apps-builder.yaml \
              --branch "$BRANCH" \
              --status "$status" \
              --json databaseId \
              --jq 'length')
            echo "$status=$count on $BRANCH"
            active=$((active + count))
          done

          if [[ "$active" -gt 0 ]]; then
            echo "Build Dev apps already active on $BRANCH, skipping trigger to avoid canceling it."
            echo "should_trigger=false" >> "$GITHUB_OUTPUT"
            echo "reason=busy" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_trigger=true" >> "$GITHUB_OUTPUT"
          echo "reason=ok" >> "$GITHUB_OUTPUT"

      - name: Trigger Dev Apps Build on ${{ matrix.branch }}
        if: steps.should_trigger.outputs.should_trigger == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ matrix.branch }}
          BUILD_TYPE: "full"
        run: |
          echo "Triggering dev-apps-builder.yaml on branch $BRANCH with build-type $BUILD_TYPE"

          response=$(curl -s -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/dev-apps-builder.yaml/dispatches" \
            -d "{\"ref\":\"$BRANCH\",\"inputs\":{\"build-type\":\"$BUILD_TYPE\"}}")

          http_code="${response: -3}"
          response_body="${response%???}"

          if [ "$http_code" = "204" ]; then
            echo "Successfully triggered dev-apps-builder.yaml on $BRANCH"
            echo "Build type: $BUILD_TYPE"
            echo "Timestamp: $(date -u)"
          else
            echo "Failed to trigger workflow. HTTP code: $http_code"
            echo "Response: $response_body"
            exit 1
          fi
