name: Code Size Check
permissions:
  contents: read
  pull-requests: read
  actions: write

on:
  push:
    branches:
      - feature/package_manager_internal_CI
  workflow_dispatch:
    inputs:
      example-app: 
        required: false
        type: string
        description: "App name as it appears in the slc/apps directory path (e.g. multi_sensor_app)"
        default: "multi_sensor_app"
      transport:
        required: false
        type: choice
        description: "Transport type (e.g. thread, wifi)"
        default: thread
        options:
          - thread
          - wifi
      project-type: 
        required: false
        type: choice
        description: "soc or 917 ncp segment in the slcp name"
        default: soc
        options:
          - soc
          - 917_ncp
      baseline:
        required: false
        type: string
        description: "Branch baseline to compare against"
        default: "main"
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - "release_*"

concurrency:
    group: code-size-check-${{ github.ref }}
    cancel-in-progress: true

env:
  EXAMPLE_APP: ${{ inputs.example-app || 'multi_sensor_app'}}
  TRANSPORT: ${{ inputs.transport || 'thread'}}
  PROJECT_TYPE: ${{ inputs.project-type || 'soc'}}
  BASELINE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.baseline || 'main'}}
  CODE_SIZE_JSON: ${{ (inputs.transport || 'thread') == 'wifi' && (inputs.project-type || 'soc') == 'soc' && '.github/silabs-code-size-wifi.json' || '.github/silabs-code-size.json' }}

jobs:
    resolve-inputs:
        runs-on: ubuntu-latest
        outputs:
            baseline: ${{ steps.resolve.outputs.baseline }}
        steps:
            - id: resolve
              run: echo "baseline=${BASELINE}" >> "$GITHUB_OUTPUT"

    current-matter-packages:
        uses: ./.github/workflows/matter-packages.yaml
        with:
            package-version: 2.10.0-test.0
            conan-cache-key: matter-conan-current-${{ github.run_id }}-${{ github.run_attempt }}

    baseline-matter-packages:
        needs: resolve-inputs
        uses: ./.github/workflows/matter-packages.yaml
        with:
            package-version: 2.10.0-test.0
            conan-cache-key: matter-conan-baseline-${{ github.run_id }}-${{ github.run_attempt }}
            checkout-ref: ${{ needs.resolve-inputs.outputs.baseline }}

    code-size-check:
        needs: [current-matter-packages, baseline-matter-packages]
        name: Code Size Check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Cache tools
              uses: ./.github/actions/cache-tools

            - name: Restore current Matter package cache
              uses: ./.github/actions/restore-matter-packages
              with:
                  conan-cache-key: ${{ needs.current-matter-packages.outputs.conan-cache-key }}

            - name: Build code-canary app
              uses: SiliconLabsSoftware/matter_build_action@v2
              env:
                  MATTER_PACKAGE_VERSION: ${{ needs.current-matter-packages.outputs.version }}
              with:
                  json-file-path: ${{ env.CODE_SIZE_JSON }}
                  path-to-example-app: "./slc/apps/${{ env.EXAMPLE_APP }}/${{ env.TRANSPORT }}/matter_${{env.TRANSPORT}}_${{ env.PROJECT_TYPE }}_${{ env.EXAMPLE_APP }}_freertos.slcp"
                  example-app: code-canary
                  build-script: "./packages/build_app.sh"
                  output-directory: " "
                  build-type: "standard"

            - name: Move results
              run: |
                  mv ./out ./current

            - name: Restore baseline Matter package cache
              uses: ./.github/actions/restore-matter-packages
              with:
                  conan-cache-key: ${{ needs.baseline-matter-packages.outputs.conan-cache-key }}

            - name: Build code-canary app on baseline
              uses: SiliconLabsSoftware/matter_build_action@v2
              env:
                  MATTER_PACKAGE_VERSION: ${{ needs.baseline-matter-packages.outputs.version }}
              with:
                  json-file-path: ${{ env.CODE_SIZE_JSON }}
                  path-to-example-app: "./slc/apps/${{ env.EXAMPLE_APP }}/${{ env.TRANSPORT }}/matter_${{env.TRANSPORT}}_${{ env.PROJECT_TYPE }}_${{ env.EXAMPLE_APP }}_freertos.slcp"
                  example-app: code-canary
                  build-script: "./packages/build_app.sh"
                  output-directory: " "
                  build-type: "standard"

            - name: Generate Code Size Results and Compare (gcc)
              shell: bash
              run: |
                  ./slc/script/code_size_result.sh ./current/ current_gcc.csv code_size_gcc
                  ./slc/script/code_size_result.sh ./out/     target_gcc.csv  code_size_gcc
                  cat ./current_gcc.csv
                  cat ./target_gcc.csv
                  python3 ./slc/script/code_size_diff_check.py ./current_gcc.csv ./target_gcc.csv --toolchain gcc \
                      | tee code_size_report_gcc.txt

            - name: Generate Code Size Results and Compare (llvm)
              ## TODO: Remove the skip condition when wifi on llvm is supported
              if: always() && env.TRANSPORT != 'wifi'
              shell: bash
              run: |
                  ./slc/script/code_size_result.sh ./current/ current_llvm.csv code_size_llvm
                  ./slc/script/code_size_result.sh ./out/     target_llvm.csv  code_size_llvm
                  cat ./current_llvm.csv
                  cat ./target_llvm.csv
                  python3 ./slc/script/code_size_diff_check.py ./current_llvm.csv ./target_llvm.csv --toolchain llvm \
                      | tee code_size_report_llvm.txt
