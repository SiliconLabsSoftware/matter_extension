#              -path '*/out/*' \
#              ! -path '*/copy-sources/*' \
#              -print0
#          )
#          echo "Found ${#bins[@]} binary file(s)"
#          for f in "${bins[@]}"; do
#            [[ -n "${f}" ]] || continue
#            rel="${f#"${MATTER_APP}"/}"
#            mkdir -p "${DEST}/$(dirname "${rel}")"
#            cp -a "${f}" "${DEST}/${rel}"
#          done
#          echo "Collected:"
#          find "${DEST}" -type f | sort
#          if [[ "${#bins[@]}" -eq 0 ]]; then
#            echo "WARNING: no flashable binaries under ${MATTER_APP}/**/out/**" >&2
#            find "${MATTER_APP}" -type d -path '*/out/*' 2>/dev/null | head -50 || true
#          fi
#
#      - name: Upload smoke binaries
#        if: >-
#          github.event.inputs.run_sanity != 'false' ||
#          github.event.inputs.run_smoke_wifi == 'true' ||
#          github.event.inputs.run_smoke_thread == 'true' ||
#          github.event.inputs.run_smoke_cmp == 'true'
#        uses: actions/upload-artifact@v7
#        with:
#          name: package-manager-smoke-binaries-${{ env.VERSION }}
#          path: smoke-artifacts/
#          if-no-files-found: warn
#          overwrite: true

      - name: Publish packages
        if: github.event.inputs.publish == 'true'
        env:
          CONAN_LOGIN_USERNAME: ${{ secrets.MATTER_PUBLIC_CONAN_USERNAME }}
          CONAN_PASSWORD: ${{ secrets.MATTER_PUBLIC_CONAN_TOKEN }}
        run: |
          set -euo pipefail
          export CONAN_HOME="${CONAN_HOME:-${HOME}/.silabs/slt/installs/conan}"
          CONAN_HOME="${CONAN_HOME/#\~/${HOME}}"
          export CONAN_HOME
          export PATH="${HOME}/.silabs/slt/engines/conan/conan:${PATH}"
          conan config home

          if [ -z "${CONAN_LOGIN_USERNAME:-}" ] || [ -z "${CONAN_PASSWORD:-}" ]; then
            echo "SATYA_CONAN_USERNAME / SATYA_CONAN_TOKEN secrets are required to publish" >&2
            exit 1
          fi

          conan remote add -f "${REMOTE_NAME}" "${REMOTE_URL}"
          conan remote login "${REMOTE_NAME}" "${CONAN_LOGIN_USERNAME}" -p "${CONAN_PASSWORD}"

          conan remote list
          conan remote list-users
          conan list "*" -r "${REMOTE_NAME}"

          echo "Uploading matter/${VERSION}@silabs to ${REMOTE_NAME}"
          conan upload "matter/${VERSION}@silabs" -r "${REMOTE_NAME}" --confirm

          echo "Uploading matter_app/${VERSION}@silabs to ${REMOTE_NAME}"
          conan upload "matter_app/${VERSION}@silabs" -r "${REMOTE_NAME}" --confirm

          conan remote list

  build-dev-apps:
    name: Build Dev Apps (from package cache)
    needs: matter-packages
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/dev-apps-builder.yaml
    with:
      build-type: full
      use-package-cache: true
      package-version: ${{ needs.matter-packages.outputs.version }}
      conan-cache-key: ${{ needs.matter-packages.outputs.conan-cache-key }}
