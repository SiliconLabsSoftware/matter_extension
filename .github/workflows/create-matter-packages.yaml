name: Create Matter Packages

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: 'MATTER_PACKAGE_VERSION (empty = slc/script/matter_package_version)'
        required: false
        type: string
        default: ''
      build_dev_apps:
        description: 'Build Dev Apps (from package cache)'
        required: false
        type: boolean
        default: true
      ota_size_check:
        description: 'Run OTA flash size check'
        required: false
        type: boolean
        default: true

concurrency:
  group: create-matter-packages-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  matter-packages:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.packages.outputs.version }}
      conan-cache-key: ${{ steps.packages.outputs.conan-cache-key }}

    steps:
      - name: Checkout matter_extension
        uses: actions/checkout@v7

      - name: Resolve package version
        id: version
        run: |
          set -euo pipefail
          V="${{ inputs.package_version }}"
          if [[ -z "${V}" ]]; then
            V="$(tr -d '[:space:]' < slc/script/matter_package_version)"
          fi
          echo "package-version=${V}" >> "$GITHUB_OUTPUT"
          echo "Using package version: ${V}"

      - name: Resolve submodule cache key
        id: submodule-key
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          MATTER_SDK=$(git rev-parse :third_party/matter_sdk)
          MATTER_SUPPORT=$(git rev-parse :third_party/matter_support)
          QR=$(git rev-parse :third_party/QR-Code-generator)
          MBEDTLS=$(git rev-parse :third_party/mbedtls)
          NLIO=$(git rev-parse :third_party/nlio)
          NLASSERT=$(git rev-parse :third_party/nlassert)
          echo "cache-key=matter-submodules-${MATTER_SDK}-${MATTER_SUPPORT}-${QR}-${MBEDTLS}-${NLIO}-${NLASSERT}" >> "$GITHUB_OUTPUT"

      - name: Cache Matter submodules
        id: submodule-cache
        uses: actions/cache@v6
        with:
          path: |
            third_party/matter_sdk
            third_party/matter_support
            third_party/QR-Code-generator
            third_party/mbedtls
            third_party/nlio
            third_party/nlassert
          key: ${{ steps.submodule-key.outputs.cache-key }}

      - name: Init Matter submodules
        if: steps.submodule-cache.outputs.cache-hit != 'true'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --depth 1 --jobs 8 \
            third_party/matter_sdk \
            third_party/matter_support \
            third_party/QR-Code-generator \
            third_party/mbedtls \
            third_party/nlio \
            third_party/nlassert

      - name: Create Matter package cache
        id: packages
        uses: ./.github/actions/create-and-cache-matter-packages
        with:
          package-version: ${{ steps.version.outputs.package-version }}

  build-dev-apps:
    name: Build Dev Apps (from package cache)
    if: ${{ inputs.build_dev_apps }}
    needs: matter-packages
    permissions:
      contents: read
      actions: write
    secrets: inherit
    uses: ./.github/workflows/dev-apps-builder-pkg.yaml
    with:
      build-type: standard
      use-package-cache: true
      package-version: ${{ needs.matter-packages.outputs.version }}
      conan-cache-key: ${{ needs.matter-packages.outputs.conan-cache-key }}

  ota-size-check:
    name: OTA flash size check
    if: ${{ inputs.ota_size_check }}
    needs: matter-packages
    permissions:
      contents: read
      actions: write
    secrets: inherit
    uses: ./.github/workflows/ota-size-checker-pkg.yaml
    with:
      package-version: ${{ needs.matter-packages.outputs.version }}
      conan-cache-key: ${{ needs.matter-packages.outputs.conan-cache-key }}
