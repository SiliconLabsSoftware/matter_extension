name: Renode Provisioning Artifacts Cleanup

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number whose provision-pr GHCR tag should be deleted"
        required: true
        type: string
  pull_request:
    types:
      - closed
    branches:
      - main
      - release_*

jobs:
  delete-pr-provision-package:
    name: Delete PR provision package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Delete provision bundle for closed PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: ./renode_integration/scripts/delete_provision_pr_package.py
