name: Check OTA Flash Space

on:
  pull_request:
    branches:
      - main
      - "release_*"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  cache-sdks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false
      - uses: ./.github/actions/cache-sdks

  ota-check:
    name: OTA check (${{ matrix.platform }} / ${{ matrix.app }})
    needs: cache-sdks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: MG24
            app: window_app
            app_path: slc/apps/window_app/thread/matter_thread_soc_window_app_freertos.slcp
            json_file: ./.github/silabs-builds-mg24-ota.json
            available_flash: 1572864 # 1536 KiB
            slot_size: 557056
            slot_name: 550K

          - platform: MG24
            app: multi_sensor_app
            app_path: slc/apps/multi_sensor_app/thread/matter_thread_soc_multi_sensor_app_freertos.slcp
            json_file: ./.github/silabs-builds-mg24-ota.json
            available_flash: 1572864 # 1536 KiB
            slot_size: 557056
            slot_name: 550K

          - platform: MG24
            app: lock_app
            app_path: slc/apps/lock_app/thread/matter_thread_soc_lock_app_freertos.slcp
            json_file: ./.github/silabs-builds-mg24-ota.json
            available_flash: 1572864 # 1536 KiB
            slot_size: 557056
            slot_name: 550K

          - platform: MGM24
            app: window_app
            app_path: slc/apps/window_app/thread/matter_thread_soc_window_app_freertos.slcp
            json_file: ./.github/silabs-builds-mgm24-ota.json
            available_flash: 1572864 # 1536 KiB
            slot_size: 557056
            slot_name: 550K

          - platform: MGM24
            app: multi_sensor_app
            app_path: slc/apps/multi_sensor_app/thread/matter_thread_soc_multi_sensor_app_freertos.slcp
            json_file: ./.github/silabs-builds-mgm24-ota.json
            available_flash: 1572864 # 1536 KiB
            slot_size: 557056
            slot_name: 550K

          - platform: MGM24
            app: lock_app
            app_path: slc/apps/lock_app/thread/matter_thread_soc_lock_app_freertos.slcp
            json_file: ./.github/silabs-builds-mgm24-ota.json
            available_flash: 1572864 # 1536 KiB
            slot_size: 557056
            slot_name: 550K

          - platform: MG26
            app: lighting_app
            app_path: slc/apps/lighting_app/thread/matter_thread_soc_lighting_app_freertos.slcp
            json_file: ./.github/silabs-builds-mg26-ota.json
            available_flash: 3276800 # 3200 KiB
            slot_size: 1048576
            slot_name: 1MB

          - platform: MG26
            app: zigbee_light
            app_path: slc/apps/zigbee_light/thread/matter_thread_soc_zigbee_light_freertos.slcp
            json_file: ./.github/silabs-builds-mg26-ota.json
            available_flash: 3276800 # 3200 KiB
            slot_size: 1048576
            slot_name: 1MB

          - platform: MGM26
            app: zigbee_light
            app_path: slc/apps/zigbee_light/thread/matter_thread_soc_zigbee_light_freertos.slcp
            json_file: ./.github/silabs-builds-mgm26-ota.json
            available_flash: 3276800 # 3200 KiB
            slot_size: 1048576
            slot_name: 1MB

    env:
      LABEL: ${{ matrix.platform }} / ${{ matrix.app }}
      AVAILABLE_FLASH: ${{ matrix.available_flash }}
      PAGE_SIZE: 8192 # 8 KiB flash page
      OTA_MARGIN: 102400 # 100 KiB minimum spare flash
      BOOTLOADER_SLOT_SIZE: ${{ matrix.slot_size }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Initialize non-SDK submodules
        run: |
          set -euo pipefail
          mapfile -t paths < <(
            git config --file .gitmodules --get-regexp '^submodule\..*\.path$' \
              | awk '{print $2}' \
              | grep -vE 'third_party/simplicity_sdk$|third_party/wifi_sdk$|third_party/third_party_hw_drivers_extension$'
          )
          git submodule update --init --depth 1 -- "${paths[@]}"

      - name: Cache SDKs
        uses: ./.github/actions/cache-sdks

      - name: Cache tools
        uses: ./.github/actions/cache-tools

      - name: Build ${{ matrix.app }}
        uses: SiliconLabsSoftware/matter_build_action@v2
        with:
          json-file-path: ${{ matrix.json_file }}
          path-to-example-app: ${{ matrix.app_path }}
          example-app: ${{ matrix.app }}
          build-script: "./slc/build.sh"
          output-directory: " "
          build-type: standard

      - name: Generate GBL images
        id: gbl
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v commander >/dev/null 2>&1; then
            echo "::error title=${LABEL} - commander missing::commander not found in PATH"
            exit 1
          fi

          mapfile -t images < <(find out -type f -name "*.s37" | sort)
          if [[ ${#images[@]} -eq 0 ]]; then
            echo "::error title=${LABEL} - no image::No .s37 image found under out/"
            exit 1
          fi

          gbl_dir="$RUNNER_TEMP/gbl"
          mkdir -p "$gbl_dir"
          : > "$RUNNER_TEMP/ota_sizes.tsv"

          for image in "${images[@]}"; do
            build=$(echo "$image" | cut -d/ -f2-3) # <board>/<build dir>
            name=$(echo "${image#out/}" | tr '/' '_')

            commander gbl create "$gbl_dir/${name}.gbl" --app "$image" >/dev/null
            commander gbl create --compress lzma "$gbl_dir/${name}.lzma.gbl" --app "$image" >/dev/null

            app_size=$(stat -c %s "$gbl_dir/${name}.gbl")
            ota_size=$(stat -c %s "$gbl_dir/${name}.lzma.gbl")
            printf '%s\t%s\t%s\n' "$build" "$app_size" "$ota_size" >> "$RUNNER_TEMP/ota_sizes.tsv"

            echo "${build}"
            echo "  image:          ${image}"
            echo "  app GBL:        ${app_size} B"
            echo "  OTA GBL (LZMA): ${ota_size} B"
          done

      - name: OTA Flash Space Verification
        shell: bash
        run: |
          set -euo pipefail
          kib() { awk -v b="$1" 'BEGIN { printf "%.1f KiB", b / 1024 }'; }
          round() { echo $(( ($1 + PAGE_SIZE - 1) / PAGE_SIZE * PAGE_SIZE )); }

          rule="flash ($(kib "$AVAILABLE_FLASH")) - app - OTA (LZMA) >= $(kib "$OTA_MARGIN"), sizes rounded up to $(kib "$PAGE_SIZE") pages"
          echo "OTA Flash Space Verification: ${LABEL}"
          echo "Rule: ${rule}"
          echo ""
          printf '%-6s  %-55s  %12s  %12s  %12s\n' "RESULT" "BUILD" "APP" "OTA (LZMA)" "SPARE"
          {
            echo ""
            echo "### OTA Flash Space Verification: ${LABEL}"
            echo "Rule: ${rule}"
            echo ""
            echo "| Result | Build | App | OTA (LZMA) | Spare |"
            echo "| --- | --- | ---: | ---: | ---: |"
          } >> "$GITHUB_STEP_SUMMARY"

          fail=0
          while IFS=$'\t' read -r build app_size ota_size; do
            app=$(round "$app_size")
            ota=$(round "$ota_size")
            spare=$(( AVAILABLE_FLASH - app - ota ))
            result=PASS
            if (( spare < OTA_MARGIN )); then
              result=FAIL
              fail=1
            fi

            printf '%-6s  %-55s  %12s  %12s  %12s\n' "$result" "$build" "$(kib "$app")" "$(kib "$ota")" "$(kib "$spare")"
            echo "| ${result} | \`${build}\` | $(kib "$app") | $(kib "$ota") | $(kib "$spare") |" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$result" == FAIL ]]; then
              echo "::error title=${LABEL} - OTA flash space::${build}: spare flash after app + OTA is $(kib "$spare"), minimum is $(kib "$OTA_MARGIN") (short by $(kib $(( OTA_MARGIN - spare ))))"
            fi
          done < "$RUNNER_TEMP/ota_sizes.tsv"

          echo ""
          if (( fail )); then
            echo "FAILED: ${LABEL} does not leave $(kib "$OTA_MARGIN") spare flash for OTA."
            exit 1
          fi
          echo "PASSED: ${LABEL}"

      - name: Bootloader Slot Verification (${{ matrix.slot_name }})
        if: ${{ !cancelled() && steps.gbl.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          kib() { awk -v b="$1" 'BEGIN { printf "%.1f KiB", b / 1024 }'; }
          round() { echo $(( ($1 + PAGE_SIZE - 1) / PAGE_SIZE * PAGE_SIZE )); }

          rule="OTA (LZMA) <= bootloader slot ($(kib "$BOOTLOADER_SLOT_SIZE")), size rounded up to $(kib "$PAGE_SIZE") pages"
          echo "Bootloader Slot Verification: ${LABEL}"
          echo "Rule: ${rule}"
          echo ""
          printf '%-6s  %-55s  %12s  %12s  %12s\n' "RESULT" "BUILD" "OTA (LZMA)" "SLOT" "SPARE"
          {
            echo ""
            echo "### Bootloader Slot Verification: ${LABEL}"
            echo "Rule: ${rule}"
            echo ""
            echo "| Result | Build | OTA (LZMA) | Slot | Spare |"
            echo "| --- | --- | ---: | ---: | ---: |"
          } >> "$GITHUB_STEP_SUMMARY"

          fail=0
          while IFS=$'\t' read -r build _ ota_size; do
            ota=$(round "$ota_size")
            spare=$(( BOOTLOADER_SLOT_SIZE - ota ))
            result=PASS
            if (( spare < 0 )); then
              result=FAIL
              fail=1
            fi

            printf '%-6s  %-55s  %12s  %12s  %12s\n' "$result" "$build" "$(kib "$ota")" "$(kib "$BOOTLOADER_SLOT_SIZE")" "$(kib "$spare")"
            echo "| ${result} | \`${build}\` | $(kib "$ota") | $(kib "$BOOTLOADER_SLOT_SIZE") | $(kib "$spare") |" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$result" == FAIL ]]; then
              echo "::error title=${LABEL} - bootloader slot::${build}: OTA image $(kib "$ota") exceeds bootloader slot $(kib "$BOOTLOADER_SLOT_SIZE") by $(kib $(( -spare )))"
            fi
          done < "$RUNNER_TEMP/ota_sizes.tsv"

          echo ""
          if (( fail )); then
            echo "FAILED: ${LABEL} OTA image does not fit in the bootloader slot."
            exit 1
          fi
          echo "PASSED: ${LABEL}"
