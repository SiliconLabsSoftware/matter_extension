name: Renode Demo Tests

on:
  workflow_run:
    workflows:
      - "Build Dev apps"
      - "Packages Validation"
    branches:
      - main
      - "release_*"
    types: [completed]

permissions:
  contents: read
  actions: read
  packages: read

env:
  BUILD_TYPE: full

jobs:
  set-matrix:
    name: Select demo apps
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          submodules: false

      - name: Install flow parser
        run: python3 -m pip install 'PyYAML>=6.0'

      - name: Configure demo job matrix
        id: matrix
        run: ./renode_integration/harness/renode_config.py

  renode-demo:
    name: ${{ matrix.example-app }} ${{ matrix.board }}
    needs: set-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.set-matrix.outputs.include) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          submodules: false

      - name: Download demo ELFs
        uses: actions/download-artifact@v7
        with:
          name: renode-demo-${{ env.BUILD_TYPE }}-${{ matrix.example-app }}-${{ matrix.platform }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: matter-elf

      - name: Download companion demo ELFs
        if: matrix.extra-app != ''
        uses: actions/download-artifact@v7
        with:
          name: renode-demo-${{ env.BUILD_TYPE }}-${{ matrix.extra-app }}-${{ matrix.platform }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: matter-elf-extra

      - uses: ./.github/actions/renode-setup
        id: setup
        with:
          example-app: ${{ matrix.example-app }}
          extra-app: ${{ matrix.extra-app }}
          board: ${{ matrix.board }}

      - name: Run README demo
        run: |
          ./renode_integration/harness/renode_test.py \
            --app "${{ matrix.example-app }}" \
            --board "${{ matrix.board }}" \
            --matter-elf "${{ steps.setup.outputs.matter_elf_path }}" \
            --extra-elf "${{ steps.setup.outputs.extra_elf_path }}"
