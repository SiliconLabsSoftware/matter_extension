name: Seed SDK cache

on:
    push:
        branches:
            - main
            - "release_*"
        paths:
            - .gitmodules
            - third_party/simplicity_sdk
            - third_party/wifi_sdk
    workflow_dispatch:

permissions:
    contents: read
    actions: write

jobs:
    cache-sdks:
        name: Seed simplicity_sdk and wifi_sdk cache
        runs-on: ubuntu-latest
        outputs:
            cache-key: ${{ steps.cache-sdks.outputs.cache-key }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  submodules: false
            - name: Cache SDKs
              id: cache-sdks
              uses: ./.github/actions/cache-sdks

    delete-previous-sdk-cache:
        name: Delete previous SDK cache
        needs: cache-sdks
        if: always() && needs.cache-sdks.result == 'success'
        runs-on: ubuntu-latest
        permissions:
            actions: write
        steps:
            - name: Delete old branch cache and PR SDK caches
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  SDK_CACHE_KEY: ${{ needs.cache-sdks.outputs.cache-key }}
              run: |
                  set -euo pipefail
                  if [[ -z "${SDK_CACHE_KEY}" ]]; then
                      echo "No SDK cache key; skipping"
                      exit 0
                  fi
                  echo "Keeping new SDK cache key: ${SDK_CACHE_KEY}"
                  echo "Current ref: ${{ github.ref }}"
                  gh cache list --repo "${{ github.repository }}" --json id,key,ref --limit 100 \
                    | jq -c '.[] | select(.key | startswith("silabs-sdks-"))' \
                    | while read -r entry; do
                        id=$(echo "${entry}" | jq -r '.id')
                        key=$(echo "${entry}" | jq -r '.key')
                        ref=$(echo "${entry}" | jq -r '.ref')
                        if [[ "${ref}" == "${{ github.ref }}" && "${key}" != "${SDK_CACHE_KEY}" ]]; then
                            echo "Deleting previous SDK cache id=${id} ref=${ref} key=${key}"
                            gh cache delete "${id}" --repo "${{ github.repository }}" || echo "Failed to delete ${id}"
                        elif [[ "${ref}" != "refs/heads/main" && ! "${ref}" =~ ^refs/heads/release_ ]]; then
                            echo "Deleting PR SDK cache id=${id} ref=${ref} key=${key}"
                            gh cache delete "${id}" --repo "${{ github.repository }}" || echo "Failed to delete ${id}"
                        else
                            echo "Keeping SDK cache id=${id} ref=${ref} key=${key}"
                        fi
                      done
